name: enforce_exec
behavior: mutator
description: "Enforce execution path rules for an explicitly bound container (BPF LSM)"
annotations:
  enable-containers-datasource: "true"
datasources:
  verdict:
    fields:
      path:
        annotations:
          description: resolved executable path
  exec_policy_updates:
    annotations:
      cli.default-output-mode: none
  containers:
    annotations:
      cli.default-output-mode: none
params:
  wasm:
    exec-policy:
      key: exec-policy
      description: "Standalone execution policy YAML, passed by value; requires host allow-enforcement"
      typeHint: string
      isMandatory: true
