version: 1
binding:
  container:
    runtime: containerd
    id: demo-container-not-resolved-by-this-spike
policy:
  mode: audit
  exec:
    default: deny
    rules:
      - name: approved-executables
        target:
          path: ["/usr/bin/**", "/opt/app/bin/**"]
        action: allow
        origin: example/approved-executables
      - name: no-shell
        target:
          path: ["/usr/bin/sh"]
        action: deny
