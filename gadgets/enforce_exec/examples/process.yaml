version: 1
binding:
  process:
    # Use the daemon's node name (NODE_NAME in Kubernetes, hostname otherwise).
    node: replace-with-node-name
    bootID: replace-with-host-boot-id
    hostPID: 12345
    startTimeTicks: 123456
policy:
  mode: enforce
  exec:
    default: deny
    rules:
      - name: approved-executables
        target:
          path: ["/usr/bin/**", "/opt/app/bin/**"]
        action: allow
