apiVersion: 1
kind: instance-spec
name: enforce-exec-spike
# Unsigned development image: configure verify-image: false on the daemon host.
# Instance parameters cannot change host trust settings.
image: enforce_exec:spike
paramValues:
  operator.oci.wasm.exec-policy: |
    version: 1
    binding:
      container:
        runtime: containerd
        id: replace-with-full-container-id
    policy:
      mode: enforce
      exec:
        default: deny
        rules:
          - name: approved-executables
            target:
              path: ["/usr/bin/**", "/opt/app/bin/**"]
            action: allow
