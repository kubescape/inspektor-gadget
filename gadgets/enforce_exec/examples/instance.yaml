apiVersion: 1
kind: instance-spec
name: enforce-exec-spike
image: enforce_exec:spike
paramValues:
  # Development-only unsigned local image; not a production trust policy.
  operator.oci.verify-image: "false"
  operator.oci.wasm.exec-policy: |
    version: 1
    binding:
      container:
        runtime: containerd
        id: demo-container-not-resolved-by-this-spike
    policy:
      mode: enforce
      exec:
        default: deny
        rules:
          - name: approved-executables
            target:
              path: ["/usr/bin/**", "/opt/app/bin/**"]
            action: allow
