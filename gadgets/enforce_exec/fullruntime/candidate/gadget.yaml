# Shared-node candidate image metadata (G019 M2). QUALIFICATION ONLY: the
# product NodeEnforcer refuses this image; only a binary built with the
# enforce_exec_shared_qualification tag and WithSharedNodeQualification admits
# it, and that node still never reports Ready.
#
# This is the PRODUCT image metadata (G019 section 8 packaging). The image's
# gadget.yaml is this file merged with
# ../bpf/opaque_real_owner_child_candidate.programs.yaml (the trampoline attach
# declaration). The product object has no TC program, so nothing here
# disables one; the merged metadata leaves exactly the qualified loader's
# steady state enabled: the pinned 8 trampoline links (task_free 2) plus 8 link-based
# kprobe/raw_tp/tp_btf probes, and exactly one syscall command,
# opaque_real_reap (the product reaper's TEST_RUN; it has no entry here, it
# is never attached and must never be disabled). The protocol command
# se_command is disabled (TestSharedCandidateMergedMetadata*).
#
# Diagnostic twins (recovery, live bootstrap: the M3 object) merge in
# addition gadget.diagnostic.yaml and
# ../bpf/opaque_real_owner_child_candidate.programs.diagnostic.yaml.
name: enforce-exec-shared-candidate
description: shared-node exec enforcement candidate (qualification only)
annotations:
  enforce-exec-owner-abi: "3"
  enforce-exec-owner-development: "true"
  enforce-exec-shared-profile: "1"
  # Geometry of sharedCandidateQualificationProfile: the product objects'
  # q(128,32) build, 2 bindings x 128 TASK / 32 WORK = 256 TASK / 64 WORK
  # node-wide (checked against the loaded map sizes at admission). 32 WORK
  # per binding: burst capacity (W-1)/2 = 15 >= the 8 zero-gated streams
  # (the WORK quota must be a power of two; 16 gave 7).
  enforce-exec-shared-images: "2"
  enforce-exec-shared-image-quota: "1"
  enforce-exec-shared-inode-facts: "2"
  enforce-exec-shared-inode-quota: "1"
  enforce-exec-shared-tasks: "256"
  enforce-exec-shared-scratch: "64"
  enforce-exec-shared-accepted-uids: "8"
  enforce-exec-shared-task-quota: "128"
  enforce-exec-shared-scratch-quota: "32"
  enforce-exec-shared-bindings: "2"
  # Burst-sized credit-at-exit tombstone table (SE_PROFILE_EXIT_TOMBSTONES):
  # sized for the exit burst, never by TASK count.
  enforce-exec-shared-exit-tombstones: "8192"
  # Three 256-cell policy objects for two bindings: revision is
  # make-before-break (the new policy is staged into a FREE object before the
  # old one is released), so one object must stay spare (product control
  # admission refuses objects <= bindings).
  enforce-exec-shared-slots-256: "3"
  enforce-exec-shared-slots-1024: "0"
  enforce-exec-shared-slots-4096: "0"
  enforce-exec-shared-slots-16384: "0"
# The product object's tail-call slots (sharedProductTailCalls, pinned at
# admission). The eBPF operator installs each target in its PROG_ARRAY at
# load, before any hook attaches, and freezes the arrays: the birth
# constructor (task_alloc), the ten exec verdict graph stages and (G019 gap
# 4) the two static-class interpreter continuation entries. Every
# target is also disabled below (opaque_real_owner_child_candidate.programs.yaml):
# a tail-call target is never attached.
tail_calls:
  - {map: opaque_real_owner_child_targets, index: 0, program: opaque_real_owner_child_target_candidate}
  - {map: opaque_real_prepare_strict, index: 0, program: opaque_real_owner_prepare_strict}
  - {map: opaque_real_prepare_audit, index: 0, program: opaque_real_owner_prepare_audit}
  - {map: opaque_real_stage_strict, index: 0, program: opaque_real_owner_stage_strict}
  - {map: opaque_real_stage_audit, index: 0, program: opaque_real_owner_stage_audit}
  - {map: opaque_real_rule_strict, index: 0, program: opaque_real_owner_rule_strict}
  - {map: opaque_real_rule_audit, index: 0, program: opaque_real_owner_rule_audit}
  - {map: opaque_real_policy_strict, index: 0, program: opaque_real_owner_policy_strict}
  - {map: opaque_real_policy_audit, index: 0, program: opaque_real_owner_policy_audit}
  - {map: opaque_real_finish_strict, index: 0, program: opaque_real_owner_finish_strict}
  - {map: opaque_real_finish_audit, index: 0, program: opaque_real_owner_finish_audit}
  - {map: opaque_real_continue_strict, index: 0, program: opaque_real_owner_continue_strict}
  - {map: opaque_real_continue_audit, index: 0, program: opaque_real_owner_continue_audit}
programs:
  # The exec failure-frame kprobes are attached (sharedCandidateProbeSet);
  # their kernel symbols differ per kernel and are set per node with
  # programs.<name>.attach_to (do_execveat_common.isra.N, and exec_binprm
  # instead of search_binary_handler where the qualified loader uses it).
  # The protocol command (a syscall program in the product object, TC in
  # recovery twins): never exposed by the candidate.
  se_command:
    attach_to: gadget_program_disabled
