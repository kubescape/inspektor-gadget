name: Uprobe tracer tests

on:
  pull_request:
    paths:
      - 'pkg/uprobetracer/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/uprobetracer.yml'
  push:
    paths:
      - 'pkg/uprobetracer/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/uprobetracer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uprobetracer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Uprobe tracer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev
      - name: Unit and race tests
        run: go test -race -count=1 -timeout=10m ./pkg/uprobetracer
      - name: Vet
        run: go vet ./pkg/uprobetracer
      - name: Kernel symbol lookup and capture tests
        run: go test -exec 'sudo -n' -count=1 -v -timeout=5m ./pkg/uprobetracer -run '^(TestCachedSymbolKernelCapture|TestCachedSymbolMatchesCilium)$'
